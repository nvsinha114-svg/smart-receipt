version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: smart-receipt-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=smart_receipt
    volumes:
      - mongo_data:/data/db
    networks:
      - smart-receipt-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-receipt-app
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      - SERVER_PORT=${SERVER_PORT:-8080}
      - SPRING_DATA_MONGODB_URI=${SPRING_DATA_MONGODB_URI:-mongodb://mongodb:27017/smart_receipt}
      - JWT_SECRET=${JWT_SECRET:-9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      - TESSERACT_DATAPATH=${TESSERACT_DATAPATH:-/usr/share/tesseract-ocr/4.00/tessdata}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - smart-receipt-network

volumes:
  mongo_data:

networks:
  smart-receipt-network:
    driver: bridge
