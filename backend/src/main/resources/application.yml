server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: smart-receipt-backend
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/smart_receipt}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:dummy-key-to-bypass-startup-check}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

tesseract:
  datapath: ${TESSERACT_DATAPATH:./tessdata}
  language: ${TESSERACT_LANGUAGE:eng}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    root: INFO
    com.smartreceipt: DEBUG
    org.springframework.security: INFO
