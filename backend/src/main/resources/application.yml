server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: smart-receipt-backend

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/smart_receipt}
      auto-index-creation: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  ai:
    vertex:
      ai:
        gemini:
          api-key: ${GEMINI_API_KEY:dummy-key-to-bypass-startup-check}
          location: ${GEMINI_LOCATION:us-central1}
          project-id: ${GEMINI_PROJECT_ID:smart-receipt}
          chat:
            options:
              model: ${GEMINI_MODEL:gemini-1.5-flash}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

resend:
  api-key: ${RESEND_API_KEY:}
  from: ${MAIL_FROM:onboarding@resend.dev}

app:
  email:
    mock-fallback-enabled: ${EMAIL_MOCK_FALLBACK_ENABLED:true}


tesseract:
  datapath: ${TESSERACT_DATAPATH:./tessdata}
  language: ${TESSERACT_LANGUAGE:eng}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    root: INFO
    com.smartreceipt: DEBUG
    org.springframework.security: INFO